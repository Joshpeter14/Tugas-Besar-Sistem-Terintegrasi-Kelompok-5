openapi: 3.0.3
info:
  title: Service Antrean Klinik/Puskesmas
  version: 1.0.0
  description: |
    Mengelola data **pasien**, **poli**, dan **nomor antrean** harian.
    Di-deploy di Vercel dengan database Supabase (PostgreSQL).

    Semua endpoint `/api/*` (kecuali `/api/health`) wajib mengirim header `x-api-key`.
    Klik tombol **Authorize** lalu isi API key.

    Alur status antrean: `menunggu` → `dipanggil` → `selesai` (atau `batal`).
servers:
  - url: /
    description: Server yang sedang membuka dokumentasi ini
  - url: http://localhost:3000
    description: Lokal
security:
  - ApiKeyAuth: []
tags:
  - name: Health
  - name: Poli
  - name: Pasien
  - name: Antrean

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Cek status service
      security: []
      responses:
        '200':
          description: Service hidup
          content:
            application/json:
              example: { status: ok, service: service-antrean, storage: supabase, time: '2026-11-24T02:00:00.000Z' }

  /api/poli:
    get:
      tags: [Poli]
      summary: Daftar poli
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Poli' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Poli]
      summary: Tambah poli
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoliInput' }
            example: { kode: D, nama: Poli Lansia }
      responses:
        '201':
          description: Poli dibuat
          content: { application/json: { schema: { $ref: '#/components/schemas/Poli' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/poli/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Poli]
      summary: Detail poli
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Poli' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Poli]
      summary: Ubah poli
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoliInput' }
            example: { nama: Poli Umum Dewasa }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Poli' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Poli]
      summary: Hapus poli (gagal bila masih dipakai antrean)
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/pasien:
    get:
      tags: [Pasien]
      summary: Daftar pasien
      parameters:
        - { name: nik, in: query, schema: { type: string }, description: Cari berdasarkan NIK }
        - { name: no_rm, in: query, schema: { type: string }, description: Cari berdasarkan nomor rekam medis }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Pasien' } }
    post:
      tags: [Pasien]
      summary: Daftarkan pasien baru (no_rm dibuat otomatis bila kosong)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasienInput' }
            example:
              nama: Budi Santoso
              nik: '3201010101900001'
              tanggal_lahir: '1990-01-01'
              jenis_kelamin: L
              no_hp: '081234567890'
              alamat: Jl. Merdeka No. 1, Bandung
      responses:
        '201': { description: Pasien dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/Pasien' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/pasien/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pasien]
      summary: Detail pasien
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pasien' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pasien]
      summary: Ubah data pasien
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasienInput' }
            example: { no_hp: '089999999999' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pasien' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Pasien]
      summary: Hapus pasien beserta antreannya
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/antrean:
    get:
      tags: [Antrean]
      summary: Daftar antrean
      parameters:
        - { name: tanggal, in: query, schema: { type: string, format: date }, example: '2026-11-24' }
        - { name: poli_id, in: query, schema: { type: integer } }
        - { name: pasien_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusAntrean' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Antrean' } }
    post:
      tags: [Antrean]
      summary: Ambil nomor antrean
      description: Nomor dibuat otomatis per poli per hari dengan format `{kode poli}-{urut}`, contoh `A-001`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pasien_id, poli_id]
              properties:
                pasien_id: { type: integer }
                poli_id: { type: integer }
                keluhan: { type: string }
                tanggal: { type: string, format: date, description: 'Default: hari ini (WIB)' }
            example: { pasien_id: 1, poli_id: 1, keluhan: Demam 3 hari }
      responses:
        '201': { description: Antrean dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/Antrean' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Pasien atau poli tidak ditemukan, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/antrean/panggil-berikutnya:
    post:
      tags: [Antrean]
      summary: Panggil antrean menunggu dengan nomor terkecil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poli_id]
              properties:
                poli_id: { type: integer }
                tanggal: { type: string, format: date }
            example: { poli_id: 1 }
      responses:
        '200': { description: Antrean yang dipanggil, content: { application/json: { schema: { $ref: '#/components/schemas/Antrean' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/antrean/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Antrean]
      summary: Detail antrean
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Antrean' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Antrean]
      summary: Ubah keluhan (hanya saat status menunggu)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [keluhan], properties: { keluhan: { type: string } } }
            example: { keluhan: Demam dan batuk }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Antrean' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Antrean]
      summary: Batalkan antrean (soft delete, status menjadi batal)
      responses:
        '200': { description: Antrean dibatalkan, content: { application/json: { schema: { $ref: '#/components/schemas/Antrean' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/antrean/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Antrean]
      summary: Ubah status antrean
      description: |
        Transisi yang diizinkan:
        - `menunggu` → `dipanggil`, `batal`
        - `dipanggil` → `selesai`, `menunggu`, `batal`
        - `selesai` → `dipanggil` (dipakai saat rekam kunjungan dihapus)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/StatusAntrean' } } }
            example: { status: selesai }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Antrean' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    ApiKeyAuth: { type: apiKey, in: header, name: x-api-key }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    BadRequest: { description: Input tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: API key salah atau tidak dikirim, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Data tidak ditemukan, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Konflik data / status, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Deleted:
      description: Berhasil dihapus
      content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Antrean tidak ditemukan }
        details: { type: string }
    StatusAntrean:
      type: string
      enum: [menunggu, dipanggil, selesai, batal]
    PoliInput:
      type: object
      properties:
        kode: { type: string, example: A, description: 1-3 huruf, dipakai sebagai prefix nomor antrean }
        nama: { type: string, example: Poli Umum }
    Poli:
      allOf:
        - $ref: '#/components/schemas/PoliInput'
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PasienInput:
      type: object
      properties:
        no_rm: { type: string, example: RM-20261124-0001 }
        nik: { type: string, example: '3201010101900001', description: 16 digit }
        nama: { type: string, example: Budi Santoso }
        tanggal_lahir: { type: string, format: date }
        jenis_kelamin: { type: string, enum: [L, P] }
        no_hp: { type: string }
        alamat: { type: string }
    Pasien:
      allOf:
        - $ref: '#/components/schemas/PasienInput'
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Antrean:
      type: object
      properties:
        id: { type: integer }
        nomor: { type: string, example: A-001 }
        nomor_urut: { type: integer, example: 1 }
        tanggal: { type: string, format: date }
        pasien_id: { type: integer }
        poli_id: { type: integer }
        keluhan: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/StatusAntrean' }
        dipanggil_at: { type: string, format: date-time, nullable: true }
        selesai_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pasien:
          type: object
          properties:
            id: { type: integer }
            no_rm: { type: string }
            nama: { type: string }
            jenis_kelamin: { type: string }
            tanggal_lahir: { type: string, format: date }
        poli:
          type: object
          properties:
            id: { type: integer }
            kode: { type: string }
            nama: { type: string }
